name: Horizon Daily Digest

on:
  schedule:
    # 01:00 UTC = 08:00 Новосибирск (вместе со сторожем балансов)
    - cron: '0 1 * * *'
  workflow_dispatch: # ручной запуск кнопкой

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # нужно для публикации сайта

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Use Arena config (Groq, free)
        run: cp data/config.arena.json data/config.json

      - name: Run Horizon
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours 24

      - name: Set current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
