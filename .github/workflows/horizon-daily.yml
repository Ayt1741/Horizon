name: Horizon Daily Digest

on:
  schedule:
    # 01:00 UTC = 08:00 Новосибирск
    - cron: '0 1 * * *'
  workflow_dispatch: # ручной запуск

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Use Arena config (Groq, free)
        run: cp data/config.arena.json data/config.json

      # ЧЕКПОИНТ: состояние Horizon (summaries/state) переживает падение и продолжается со следующего запуска
      - name: Restore Horizon state (checkpoint)
        id: state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: horizon-state-${{ github.run_id }}
          restore-keys: |
            horizon-state-

      - name: Run Horizon (с автоповтором при 429/лимитах)
        id: horizon
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4; do
            echo "=== Попытка $i ==="
            if uv run horizon --hours 24; then echo "OK"; break; fi
            echo "Прогон прерван, ждём 30с и продолжаем с чекпоинта..."
            sleep 30
          done

      - name: Save Horizon state (ВСЕГДА, даже при ошибке)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: horizon-state-${{ github.run_id }}

      - name: Set current date
        if: always()
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
